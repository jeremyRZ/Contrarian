# 港股投资研究平台 - 配置模板
# 复制本文件为 config.yaml 并填入你的信息

futu:
  # Optional read-only account IDs. Leave empty to auto-discover the account
  # matching trd_env in each market; fill only when multiple accounts exist.
  accounts: {HK: "", CN: "", US: ""}
  host: "127.0.0.1"   # FutuOpenD 网关地址（本机或云端）
  port: 11111          # FutuOpenD 监听端口（默认 11111）
  trd_env: "REAL"      # REAL（真实）+ SIMULATE（模拟）

# Tiger OpenAPI is used only for read-only US position queries.
tiger:
  enabled: false
  props_path: "C:/path/to/folder-containing-tiger_openapi_config.properties"
  readonly: true
  acc_id: ""           # 富途交易账户 ID（在富途 App 内查看，留空则自动取首个账户）
  watchlist_group: "Contrarian"  # 富途自选增删目标分组（必须是你在富途客户端自建的用户分组，API 无法创建分组）

ipo:
  # 打新模块联网取数超时（秒）
  timeout: 15
  # 数据源优先级：sina（新浪财经）/ hkexnews（披露易）
  sources: ["sina", "hkexnews"]

monitor:
  # false：仍展示集中度/杠杆/止损提醒，但不阻断策略买入信号。
  portfolio_gate_enabled: false
  # 风控铁律（可选覆盖）
  max_single_loss_pct: 3.0     # 单笔亏损 ≤ 总本金 3%
  max_total_risk_pct: 10.0     # 总风险敞口 ≤ 10%
  min_cash_pct: 15.0           # 现金 ≥ 15%
  # 单票页持仓快捷选择中排除的股票（如已停牌的老千股，分析无数据且干扰选择）。
  # 填股票代码，可多个；改完需重启后端。
  holdings_exclude: ["HK.44165"]

screener:
  # 默认扫描池：港股龙头观察池（可在前端覆盖为自定义代码列表）
  default_watchlist: "leaders"

# 企业微信群机器人（持仓预警 / 错杀观察 / 每日背离报告推送）
# 优先使用环境变量 CONTRARIAN_WECOM_WEBHOOK，避免密钥进入Git。
# 也可在本机未跟踪的 config.yaml 中填写。
# 留空则所有推送降级为服务端日志（不报错、不阻塞）。
wecom:
  webhook: ""

# 每日持仓资金面背离报告自动推送（后端内置调度器，进程常驻即按点推送）
schedule:
  enabled: true        # false 则关闭每日自动推送
  time: "16:30"        # 推送时间（本地时间，建议收盘后）

# 独立守护：可配置 healthchecks.io 等外部 dead-man URL。
# 外部服务在若干次心跳未到时报警，才能覆盖电脑关机或本机守护进程死亡。
watchdog:
  heartbeat_url: ""     # 也可使用环境变量 CONTRARIAN_HEARTBEAT_URL

# 小米20交易日方向研究观察：只记录 BULLISH/BEARISH/NEUTRAL，不产生交易推送。
xiaomi_directional:
  enabled: true
  threshold_pct: 5.0
  role: "RESEARCH_ONLY"
  notifications_enabled: false
  execution_mode: "NON_ACTIONABLE_OBSERVATION"

# 小米期权选择层：55日突破后选择约10%虚值、30–60天到期的Call/Put。
xiaomi_options:
  enabled: true
  role: "RESEARCH_ONLY"
  notifications_enabled: false
  historical_gate_passed: false
  min_days_to_expiry: 30
  max_days_to_expiry: 60
  target_otm_pct: 15.0
  max_spread_pct: 25.0
  max_premium_risk_pct: 1.0
  execution_mode: "READ_ONLY_USER_CONFIRMATION_REQUIRED"

# 盘中「恒科急跌联动」低吸扫描调度
# 交易时段守护线程：周一至周五 09:30–16:00（HK）内按 interval_min 扫描一次，
# 仅当恒生科技指数急跌（≤ threshold）时推送企业微信（指纹去重，最短 30 分钟）。
intraday:
  enabled: true            # 盘中调度总开关
  interval_min: 5          # 扫描间隔（分钟）；正式信号开盘执行提醒同频检查
  start: "09:20"           # 开盘前先提醒正式次日开盘计划
  end: "16:00"             # 交易时段结束
  threshold: -2.0          # 急跌阈值（恒科涨跌%，≤ 此值判定为急跌）
  hstech_code: "HK.800700" # 恒生科技指数（注意：HK.800000 是恒生指数，非科技指数）
