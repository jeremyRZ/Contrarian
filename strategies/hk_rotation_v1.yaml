name: hk_liquid_trend_rotation_v1
market: HK
capital_hkd: 20000
data_frequency: daily
review_days: 20
maximum_positions: 4
maximum_total_allocation: 0.60
per_position_target_allocation: 0.15
universe:
  price_min_hkd: 2
  historical_20d_turnover_min_hkd: 100000000
  current_spread_max_bps: 20
  current_lot_notional_max_hkd: 12000
filters:
  hang_seng_close_above_ma120: true
  stock_close_above_ma60: true
  ma_order: MA20>MA60>MA120
  annualized_volatility_60d_min: 0.12
  annualized_volatility_60d_max: 0.70
  momentum_120d_min: 0.10
ranking: momentum_120d/annualized_volatility_60d
exit: sell_next_open_when_any_absolute_filter_fails
execution:
  entry: next_open
  exit: next_open
  slippage_each_side_bps: 8
  fee_each_side_bps: 12
  round_to_board_lot: true
notes:
  - Signal parameters were constrained using data before 2024; the portfolio structure was robustness-tested on later history.
  - Empty slots remain cash when one board lot is unaffordable.
  - Research only; paper trade before enabling Futu orders.
