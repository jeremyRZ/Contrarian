<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>多市场 · Contrarian</title><link rel="stylesheet" href="app.css?v=20260814-5"><link rel="icon" href="favicon.ico"></head>
<body data-page="markets">
<nav class="topnav"><div class="brand"><img src="logo.png" alt="Contrarian" class="logo-img"></div><div class="links"></div><div id="conn" class="status bad">检测中…</div></nav>
<main class="terminal-page market-hub">
  <header class="terminal-head"><div><h1>多市场研究</h1><p>统一查看港股、A股和美股；所有新增市场默认只读。</p></div></header>
  <div id="market_tabs" class="market-tabs" role="tablist"></div>
  <section class="market-summary-grid"><div><span>市场</span><strong id="summary_name">—</strong></div><div><span>基准</span><strong id="summary_benchmark">—</strong></div><div><span>币种</span><strong id="summary_currency">—</strong></div><div><span>交易制度</span><strong id="summary_settlement">—</strong></div><div><span>买入单位</span><strong id="summary_lot">—</strong></div></section>
  <div id="market_notice"></div>
  <section class="card" id="search_panel"><div class="section-head"><div><h2>A股搜索</h2><p>支持 SH.603993、SZ.000001 或六位数字</p></div></div><form id="security_search" class="market-search"><input id="market_query" class="inp" placeholder="输入代码或名称" autocomplete="off"><button class="act" type="submit">搜索</button></form><div id="search_results" class="search-results"><span class="muted">输入股票代码或名称开始搜索</span></div></section>
  <section class="card" id="detail_panel"><div class="section-head"><div><h2 id="detail_title">单股研究</h2><p id="detail_subtitle">点击搜索结果或候选股票查看</p></div></div><div id="security_detail" class="security-detail"><span class="muted">尚未选择股票</span></div></section>
  <section class="card" id="candidate_panel"><div class="section-head"><div><h2>A股研究候选池</h2><p>固定规则扫描；验证未通过时不会产生正式买入动作</p></div><button id="refresh_candidates" class="act">刷新</button></div><div id="candidate_meta" class="muted">正在读取…</div><div class="table-wrap"><table class="stock-table"><thead><tr><th>股票</th><th>观察动作</th><th>正式动作</th><th>价格</th><th>MA60</th><th>量比</th><th>验证</th></tr></thead><tbody id="candidate_rows"></tbody></table></div></section>
  <section class="card" id="event_panel"><div class="section-head"><div><h2>ContestTrade事件候选</h2><p>仅作为研究线索，不直接触发交易</p></div></div><div id="event_rows" class="event-candidates"><span class="muted">尚未导入候选</span></div></section>
</main>
<script src="app.js?v=20260814-5"></script>
<script>
let MARKETS=[];
const json=async url=>{const r=await fetch(url),j=await r.json();if(!j.ok)throw new Error(j.error||'请求失败');return j.data};
const statusName=s=>({ACTIVE:'已激活',PAPER:'前向模拟',RESEARCH_ONLY:'研究中',REJECTED:'已淘汰'})[s]||s||'未知';
async function boot(){try{const d=await json('/api/markets');MARKETS=d.markets;renderTabs();selectMarket('CN')}catch(e){showError(e)}}
function renderTabs(){$('market_tabs').innerHTML=MARKETS.map(x=>`<button role="tab" data-market="${x.market}" onclick="selectMarket('${x.market}')">${esc(x.name)}${x.enabled?'':' · 待接入'}</button>`).join('')}
async function selectMarket(market){document.querySelectorAll('#market_tabs button').forEach(x=>x.classList.toggle('active',x.dataset.market===market));const m=MARKETS.find(x=>x.market===market);if(!m)return;$('summary_name').textContent=m.name;$('summary_benchmark').textContent=m.benchmark;$('summary_currency').textContent=m.currency;$('summary_settlement').textContent=m.settlement;$('summary_lot').textContent=m.lot_size+'股';const cn=market==='CN';['search_panel','detail_panel','candidate_panel','event_panel'].forEach(id=>$(id).hidden=!cn);if(market==='HK'){$('market_notice').innerHTML='<div class="market-notice">港股生产功能继续使用 <a href="strategy-center.html">今日决策</a>。</div>';return}if(market==='US'){$('market_notice').innerHTML='<div class="market-notice pending">美股市场模型已经预留，行情与策略适配器尚未启用。</div>';return}$('market_notice').innerHTML='<div class="market-notice research">A股当前为只读研究模式。通过历史三段验证和前向模拟后，策略才可升级。</div>';await loadCandidates()}
$('security_search').addEventListener('submit',async e=>{e.preventDefault();const q=$('market_query').value.trim();if(!q)return;showLoading('正在搜索A股…');try{const d=await json('/api/securities/search?market=CN&q='+encodeURIComponent(q));renderSearch(d.items)}catch(x){showError(x,'search_results')}finally{hideLoading()}});
function renderSearch(rows){$('search_results').innerHTML=rows.length?rows.map(x=>`<button onclick="loadSecurity('${x.code}')"><b>${esc(x.name||x.symbol)}</b><span>${esc(x.code)} · ${esc(x.exchange)}</span></button>`).join(''):'<span class="muted">没有匹配证券；可直接输入完整代码</span>';if(!rows.length){const q=$('market_query').value.trim();if(/^((SH|SZ)\.)?\d{6}$/i.test(q))loadSecurity(q)}}
async function loadSecurity(code){showLoading('正在计算A股指标与验证状态…');try{renderDetail(await json('/api/securities/'+encodeURIComponent(code)+'/analysis'))}catch(e){showError(e,'security_detail')}finally{hideLoading()}}
function renderDetail(d){const s=d.security,g=d.signal||{},i=g.indicators||{},v=d.validation||{};$('detail_title').textContent=(s.name||s.symbol)+' · '+s.code;$('detail_subtitle').textContent=`${s.exchange} · ${s.currency} · ${d.execution_mode}`;$('security_detail').innerHTML=`<div class="detail-verdict"><span>当前观察</span><b class="action ${String(g.observed_action||'wait').toLowerCase()}">${esc(g.observed_action||'WAIT')}</b><small>${esc(g.reason||'')}</small></div><dl><div><dt>收盘价</dt><dd>${fmt(g.signal_price,3)}</dd></div><div><dt>MA20</dt><dd>${fmt(i.ma20,3)}</dd></div><div><dt>MA60</dt><dd>${fmt(i.ma60,3)}</dd></div><div><dt>突破线</dt><dd>${fmt(i.prior_high20,3)}</dd></div><div><dt>失效参考</dt><dd>${fmt(g.invalid_price,3)}</dd></div><div><dt>量比</dt><dd>${fmt(i.volume_ratio,2)}</dd></div></dl><div class="validation-banner"><b>${statusName(v.status)}</b><span>${esc(v.reason||'')}</span></div>`}
async function loadCandidates(){showLoading('正在扫描A股研究池…');try{renderCandidates(await json('/api/cn/candidates'))}catch(e){showError(e,'candidate_meta')}finally{hideLoading()}}
function renderCandidates(d){$('candidate_meta').textContent=`股票池 ${d.universe_size}只 · 完成 ${d.evaluated}只 · ${d.execution_mode}`;$('candidate_rows').innerHTML=(d.candidates||[]).map(x=>`<tr onclick="loadSecurity('${x.code}')"><td><b>${esc(x.code)}</b></td><td><span class="action ${String(x.observed_action).toLowerCase()}">${esc(x.observed_action)}</span></td><td>${esc(x.action)}</td><td>${fmt(x.signal_price,3)}</td><td>${fmt(x.indicators?.ma60,3)}</td><td>${fmt(x.indicators?.volume_ratio,2)}</td><td>${statusName(x.validation_status)}</td></tr>`).join('')||'<tr><td colspan="7">暂无可计算股票；请检查A股行情权限或本地数据</td></tr>';renderEvents(d.event_candidates)}
function renderEvents(e){$('event_rows').innerHTML=(e?.items||[]).map(x=>`<button onclick="loadSecurity('${x.code}')"><b>${esc(x.name||x.code)}</b><span>${esc((x.catalysts||[]).join(' · ')||'无催化说明')}</span><small>${statusName(x.validation_status)}</small></button>`).join('')||`<span class="muted">${esc(e?.reason||'尚未导入ContestTrade候选')}</span>`}
function showError(e,id='market_notice'){const el=$(id);if(el)el.innerHTML=`<div class="err">${esc(e.message||e)}</div>`}
$('refresh_candidates').onclick=loadCandidates;boot();
</script></body></html>
