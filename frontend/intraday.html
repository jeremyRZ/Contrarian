<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>盘中急跌联动 · Contrarian 港股错杀猎手</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
<link rel="icon" href="favicon.ico" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body data-page="intraday">
  <nav class="topnav">
    <div class="brand"><img src="logo.png" alt="Contrarian" class="logo-img"></div>
    <div class="links">
      <a href="index.html" data-page="hunter">错杀猎手</a>
      <a href="analyze.html" data-page="analyze">单票深度</a>
      <a href="intraday.html" data-page="intraday">盘中急跌联动</a>
      <a href="strategies.html" data-page="strategies">6大策略</a>
      <a href="ipo.html" data-page="ipo">新股打新</a>
    </div>
    <div id="conn" class="status bad">检测中…</div>
  </nav>

  <main class="page">
    <div class="page-head">
      <h1>盘中急跌联动</h1>
      <p>恒生科技指数盘中急跌时，扫描持仓 / 观察池 / 龙头池的「跟跌」个股，捕捉错杀低吸窗口</p>
    </div>

    <!-- 恒科状态 -->
    <section class="card">
      <div class="card-head">
        <div class="card-title">恒生科技指数 <span class="sub" id="idx_code">HK.800700</span></div>
        <div id="idx_status" class="pill warn">检测中…</div>
      </div>
      <div class="grid2">
        <div>
          <div class="big" id="idx_change">—</div>
          <div class="muted" style="margin-top:4px">当日涨跌%（港股：跌绿涨红）</div>
        </div>
        <div>
          <div class="kv"><span>现价</span><span id="idx_price">—</span></div>
          <div class="kv"><span>日内回撤</span><span id="idx_dd">—</span></div>
          <div class="kv"><span>急跌阈值</span><span id="idx_th">—</span></div>
        </div>
      </div>
    </section>

    <!-- 调度控制 -->
    <section class="card">
      <div class="card-head">
        <div class="card-title">盘中扫描调度 <span class="sub" id="sched_window">09:30–16:00</span></div>
        <button class="act" id="btn_scan" onclick="runScan()">立即扫描</button>
      </div>
      <div class="row">
        <div class="field">
          <label>调度开关</label>
          <button class="subtab" id="btn_toggle" onclick="toggleSched()">—</button>
        </div>
        <div class="field">
          <label>扫描间隔（分钟）</label>
          <select id="sel_interval" onchange="setIntervalMin(this.value)">
            <option value="15">15</option>
            <option value="30">30</option>
            <option value="60">60</option>
          </select>
        </div>
        <div class="field">
          <label>急跌阈值（%）</label>
          <input id="inp_threshold" type="number" step="0.5" style="width:90px" onchange="setThreshold(this.value)" />
        </div>
      </div>
      <div class="grid2" style="margin-top:16px">
        <div class="kv"><span>上次扫描</span><span id="st_last">—</span></div>
        <div class="kv"><span>下次扫描</span><span id="st_next">—</span></div>
        <div class="kv"><span>累计扫描</span><span id="st_runs">—</span></div>
        <div class="kv"><span>累计推送</span><span id="st_pushes">—</span></div>
      </div>
      <div class="hint-bar" style="margin-top:14px">
        调度仅在周一至周五 HK 交易时段（09:30–16:00）内运行；仅当恒科急跌触发时推送企业微信，
        同一急跌窗口内指纹去重（最短 30 分钟），避免轰炸。
      </div>
    </section>

    <!-- 低吸候选 -->
    <section class="card">
      <div class="card-head">
        <div class="card-title">低吸候选 <span class="sub" id="cand_count">—</span></div>
        <div class="muted" id="cand_note"></div>
      </div>
      <div id="cand_result" class="muted">点击「立即扫描」开始</div>
    </section>

    <!-- 推送预览 -->
    <section class="card">
      <div class="card-head">
        <div class="card-title">企业微信推送预览 <span class="sub">急跌触发时发送</span></div>
      </div>
      <pre id="md_preview" class="muted" style="white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;line-height:1.6;margin:0"></pre>
    </section>
  </main>

<script src="app.js"></script>
<script>
function fmtTs(ts) {
  if (!ts) return "—";
  const d = new Date(ts * 1000);
  return d.toLocaleString("zh-CN", {hour12: false});
}

async function loadStatus() {
  try {
    const r = await fetch("/intraday/status");
    const j = await r.json();
    if (!j.ok) return;
    const s = j.data;
    // toggle
    const tb = $("btn_toggle");
    tb.textContent = s.enabled ? "● 运行中" : "○ 已关闭";
    tb.className = "subtab" + (s.enabled ? " active" : "");
    // interval / threshold / window
    $("sel_interval").value = String(s.interval_min);
    $("inp_threshold").value = s.threshold;
    $("sched_window").textContent = s.window.replace("-", "–");
    // stats
    $("st_last").textContent = fmtTs(s.last_run);
    $("st_next").textContent = s.running ? "交易时段内（按间隔）" : fmtTs(s.next_run);
    $("st_runs").textContent = s.runs;
    $("st_pushes").textContent = s.pushes;
  } catch (e) { /* ignore */ }
}

async function loadScan(push) {
  showLoading("正在扫描盘中急跌联动…");
  try {
    const r = await fetch("/intraday/scan?push=" + (push ? "true" : "false"));
    const j = await r.json();
    if (!j.ok) { $("cand_result").innerHTML = '<div class="err">' + j.error + '</div>'; return; }
    const d = j.data;
    const idx = d.index || {};
    // 指数状态
    $("idx_code").textContent = idx.code || "HK.800700";
    const chg = idx.change_rate;
    const chgEl = $("idx_change");
    chgEl.textContent = (chg == null ? "—" : (chg >= 0 ? "+" : "") + chg.toFixed(2) + "%");
    chgEl.className = "big " + (chg == null ? "" : (chg >= 0 ? "up" : "down"));
    $("idx_price").textContent = (idx.last_price == null ? "—" : idx.last_price);
    $("idx_dd").textContent = (idx.intraday_drawdown == null ? "—" : (idx.intraday_drawdown >= 0 ? "+" : "") + idx.intraday_drawdown.toFixed(2) + "%");
    $("idx_th").textContent = (d.threshold == null ? "—" : d.threshold + "%");
    const st = $("idx_status");
    if (d.crash) { st.textContent = "🟢 急跌（触发）"; st.className = "pill risk"; }
    else { st.textContent = "⚪ 常态"; st.className = "pill warn"; }

    // 候选表
    const cands = d.candidates || [];
    $("cand_count").textContent = cands.length ? (cands.length + " 只跟跌") : "无跟跌";
    const hit = cands.filter(c => c.dip_score > 0).length;
    $("cand_note").textContent = hit ? ("其中 " + hit + " 只有低吸信号") : "";
    renderCandidates(cands);

    // markdown 预览
    $("md_preview").textContent = d.markdown || "（无内容）";
  } finally { hideLoading(); }
}

function renderCandidates(cands) {
  const el = $("cand_result");
  if (!cands.length) { el.innerHTML = '<div class="muted">当前候选池无「跟跌」个股，或数据获取失败。</div>'; return; }
  let html = `<table><thead><tr><th>代码</th><th>名称</th><th>来源</th><th>现价</th>
    <th>今日%</th><th>52周位%</th><th>反向分</th><th>低吸评分</th><th>信号</th><th>建议</th></tr></thead><tbody>`;
  cands.forEach(c => {
    const srcPill = c.source === "持仓" ? pill(c.source, "push")
                  : c.source === "观察" ? pill(c.source, "warn")
                  : pill(c.source, "");
    const rev = (c.reverse_score || 0) > 0 ? ('<span class="rev-pos">+' + c.reverse_score + '</span>') : fmt(c.reverse_score, 1);
    const dps = c.dip_score || 0;
    const dpCls = dps >= 6 ? "good" : (dps >= 3 ? "warn" : "");
    const sigs = (c.reverse_signals || []).map(s => pill(s, "good")).join(" ");
    html += `<tr class="has-link"><td><span class="stock-link" onclick="openAnalyze('${c.code}')">${c.code}</span></td>
      <td><span class="stock-link" onclick="openAnalyze('${c.code}')">${c.name}</span></td>
      <td>${srcPill}</td><td class="mono">${fmt(c.price, 3)}</td>
      <td class="${cls(c.change_rate)} mono">${fmt(c.change_rate, 2)}</td>
      <td class="mono">${fmt(c.week52_position_pct, 1)}</td><td class="mono">${rev}</td>
      <td class="mono"><b>${fmt(dps, 1)}</b> ${dpCls ? pill(c.conviction, dpCls) : ''}</td>
      <td>${sigs || '—'}</td><td>${c.advice || ''}</td></tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

async function runScan() { await loadScan(false); }

async function toggleSched() {
  const cur = $("btn_toggle").className.includes("active");
  const on = !cur;
  try {
    showLoading(on ? "开启盘中调度…" : "关闭盘中调度…");
    await fetch("/intraday/config", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action: "enable", value: on})});
  } finally { hideLoading(); loadStatus(); }
}

async function setIntervalMin(v) {
  try {
    await fetch("/intraday/config", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action: "interval", value: parseInt(v, 10)})});
    loadStatus();
  } catch (e) {}
}

async function setThreshold(v) {
  const t = parseFloat(v);
  if (isNaN(t)) return;
  try {
    await fetch("/intraday/config", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action: "threshold", value: t})});
    $("idx_th").textContent = t + "%";
    loadStatus();
  } catch (e) {}
}

loadStatus();
loadScan(false);
setInterval(loadStatus, 30000);
</script>
</body>
</html>
