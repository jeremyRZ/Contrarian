<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>风险控制 · Contrarian</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" href="favicon.ico" />
</head>
<body data-page="risk">
  <nav class="topnav">
    <div class="brand"><img src="logo.png" alt="Contrarian" class="logo-img"></div>
    <div class="links"></div>
    <div id="conn" class="status bad">检测中…</div>
  </nav>
  <main class="page">
    <div class="page-head">
      <h1>风险控制</h1>
      <p>先避免大亏，再谈收益。这里只显示持仓纪律与已配置价格报警。</p>
    </div>
    <section class="card">
      <div class="card-head">
        <div class="card-title">持仓处置</div>
        <button class="act" onclick="loadRisk()">刷新</button>
      </div>
      <div id="risk_summary" class="muted">正在读取持仓…</div>
      <div id="risk_positions" class="muted" style="margin-top:14px"></div>
    </section>
    <section class="card">
      <div class="card-title">价格报警<span class="sub">交易时段自动检查并推送</span></div>
      <div id="risk_alerts" class="muted" style="margin-top:12px">正在读取报警…</div>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
  async function loadRisk(quiet=false) {
    if (!quiet) showLoading('正在检查持仓与价格报警…');
    try {
      const [mr, ar] = await Promise.all([fetch('/monitor'), fetch('/price-alerts')]);
      const [m, a] = await Promise.all([mr.json(), ar.json()]);
      if (!m.ok) {
        $('risk_summary').innerHTML = '<div class="err">'+m.error+'</div>';
      } else {
        const d=m.data, s=d.summary||{}, rows=d.positions||[];
        $('risk_summary').innerHTML=`持仓 <b>${s.count||0}</b> 项 · 市值 <b>HK$${fmt(s.total_market_val,0)}</b> · 浮动盈亏 <b class="${cls(s.total_pl_val||0)}">HK$${fmt(s.total_pl_val,0)}</b>`;
        $('risk_positions').innerHTML=!rows.length?'当前没有可监控持仓':`<table><thead><tr><th>持仓</th><th>品种</th><th>盈亏%</th><th>止损价</th><th>处置建议</th></tr></thead><tbody>${rows.map(x=>`<tr><td><span class="stock-link" onclick="openAnalyze('${x.code}')">${x.code}</span> ${x.name}</td><td>${x.type}</td><td class="${cls(x.pl_ratio||0)}">${fmt(x.pl_ratio,2)}%</td><td>${fmt(x.stop_loss_price,3)}</td><td>${x.advice||'—'}</td></tr>`).join('')}</tbody></table>`;
      }
      if (!a.ok) {
        $('risk_alerts').innerHTML='<div class="err">'+a.error+'</div>';
      } else {
        const rows=a.data.items||[];
        $('risk_alerts').innerHTML=!rows.length?'尚未配置价格报警。可在个股页分析后设置。':`<table><thead><tr><th>股票</th><th>现价</th><th>预警</th><th>警告</th><th>止损</th><th>当前状态</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.code} ${x.name}</td><td>${fmt(x.price,3)}</td><td>${fmt(x.warn_px,3)}</td><td>${fmt(x.alarm_px,3)}</td><td>${fmt(x.stop_px,3)}</td><td>${(x.active_signals||[]).join('；')||'正常'}</td></tr>`).join('')}</tbody></table>`;
      }
    } finally { if (!quiet) hideLoading(); }
  }
  loadRisk();
  setInterval(() => loadRisk(true), 60000);
  </script>
</body>
</html>
