<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>错杀猎手 · Contrarian 港股错杀猎手</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
<link rel="icon" href="favicon.ico" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body data-page="hunter">
  <nav class="topnav">
    <div class="brand"><img src="logo.png" alt="Contrarian" class="logo-img"></div>
    <div class="links">
      <a href="index.html" data-page="hunter">错杀猎手</a>
      <a href="analyze.html" data-page="analyze">单票深度</a>
      <a href="intraday.html" data-page="intraday">盘中急跌联动</a>
      <a href="strategies.html" data-page="strategies">6大策略</a>
      <a href="backtest.html" data-page="backtest">回测验证</a>
      <a href="ipo.html" data-page="ipo">新股打新</a>
    </div>
    <div id="conn" class="status bad">检测中…</div>
  </nav>

  <main class="page">
    <div class="page-head">
      <h1>错杀猎手</h1>
      <p>全市场低吸 / 超卖股票池看板 — 多因子打分 + 仓位感知推送</p>
    </div>

    <section class="card">
      <div class="card-head">
        <div class="card-title">股票池 <span class="sub">综合选股扫描 / 错杀观察池</span></div>
        <div class="subtabs">
          <button class="subtab active" data-sub="scan" onclick="switchHunter('scan')">综合选股扫描</button>
          <button class="subtab" data-sub="missed" onclick="switchHunter('missed')">错杀观察池</button>
        </div>
      </div>

      <!-- 综合选股扫描 -->
      <div id="hunter-scan">
        <div class="row">
          <div class="field">
            <label>自定义代码（逗号分隔，留空用龙头池）</label>
            <input id="s_codes" placeholder="HK.00700, HK.09988" style="width:320px" />
          </div>
          <div class="field">
            <label>数量</label>
            <input id="s_top" value="20" style="width:64px" />
          </div>
          <button class="act" onclick="runScreener()">扫描</button>
        </div>
        <div id="s_meta" class="muted" style="margin-top:14px"></div>
        <div id="s_result" class="muted" style="margin-top:8px">点击「扫描」开始</div>
        <div id="scoreChart"></div>
      </div>

      <!-- 错杀观察池 -->
      <div id="hunter-missed" style="display:none">
        <div class="row">
          <div class="field"><label>数量</label><input id="m_top" value="5" style="width:64px" /></div>
          <div class="field">
            <label>池</label>
            <select id="m_pool"><option value="leaders">龙头池</option><option value="all">全市场</option></select>
          </div>
          <button class="act" onclick="runMissed()">扫描错杀</button>
        </div>
        <div id="missed_result" class="muted" style="margin-top:14px">点击「扫描错杀」开始（盈利且被错杀的优质标的）</div>
      </div>
    </section>
  </main>

<script src="app.js"></script>
<script>
function switchHunter(sub) {
  document.querySelectorAll('.subtab').forEach(b => b.classList.remove('active'));
  document.querySelector(`.subtab[data-sub="${sub}"]`).classList.add('active');
  $('hunter-scan').style.display = (sub === 'scan') ? '' : 'none';
  $('hunter-missed').style.display = (sub === 'missed') ? '' : 'none';
}

async function runScreener() {
  const codes = $('s_codes').value.trim();
  const top = $('s_top').value;
  let url = '/screener?top_n=' + top;
  if (codes) url += '&codes=' + encodeURIComponent(codes);
  showLoading('正在扫描综合选股池…');
  try {
  const r = await fetch(url); const j = await r.json();
  const el = $('s_result'); const meta = $('s_meta');
  if (!j.ok) { meta.innerHTML=''; el.innerHTML = '<div class="err">'+j.error+'</div>'; return; }
  const d = j.data; const rows = d.results || [];
  const cashPct = d.cash_ratio == null ? '—' : (d.cash_ratio * 100).toFixed(1) + '%';
  meta.innerHTML = `仓位：<b>${d.cash_state}</b> · 现金比例 ${cashPct} · 推送门槛 ${d.push_threshold} 分${d.stop_push?'（满仓停推）':''} · 恒科涨跌 ${d.hstech_drop}%`;
  if (!rows.length) { el.innerHTML = '<div class="muted">无结果</div>'; return; }
  let html = `<table><thead><tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌%</th>
    <th>PE</th><th>52周位%</th><th>技术分</th><th>错价分</th><th>综合分</th><th>数据可信度</th><th>质量门槛</th><th>推送</th><th>信号</th></tr></thead><tbody>`;
  rows.forEach(x => {
    const push = x.push ? pill('推','push') : '';
    const quality = x.quality_gate || {};
    const qualityPill = quality.status === 'pass' ? pill('通过','good')
      : quality.status === 'fail' ? pill('否决','risk') : pill('数据不足','warn');
    const revSigs = (x.reverse_signals || []).map(s=>pill(s,'good')).join(' ');
    html += `<tr class="has-link"><td><span class="stock-link" onclick="openAnalyze('${x.code}')">${x.code}</span></td>
      <td><span class="stock-link" onclick="openAnalyze('${x.code}')">${x.name}</span></td><td class="mono">${fmt(x.price, 3)}</td>
      <td class="${cls(x.change_rate)} mono">${fmt(x.change_rate, 2)}</td><td class="mono">${fmt(x.pe, 2)}</td>
      <td class="mono">${fmt(x.week52_position_pct, 1)}</td><td class="mono">${fmt(x.technical_score, 1)}</td><td class="mono">${fmt(x.mispricing_score, 1)}</td>
      <td class="mono"><b>${fmt(x.total_score, 1)}</b></td><td class="mono">${fmt(x.data_confidence, 0)}%</td><td>${qualityPill}</td><td>${push}</td>
      <td>${x.signals.map(s=>pill(s,'warn')).join(' ')} ${revSigs}</td></tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
  const top10 = rows.slice(0,10);
  const mx = Math.max(10, ...top10.map(x=>(x.total_score||x.score)));
  const c = echarts.init($('scoreChart'));
  c.setOption({ tooltip:{}, grid:{left:80,right:30},
    xAxis:{type:'value', max: mx}, yAxis:{type:'category', data: top10.map(x=>x.name).reverse()},
    series:[{type:'bar', data: top10.map(x=>(x.total_score||x.score)).reverse(),
      itemStyle:{
        color: new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#0071e3'},{offset:1,color:'#4ea1ff'}]),
        borderRadius:[0,5,5,0] },
      label:{show:true,position:'right',color:'#1d1d1f',fontWeight:600} }] });
  } finally { hideLoading(); }
}

async function runMissed() {
  const top = $('m_top').value; const pool = $('m_pool').value;
  showLoading('正在扫描错杀观察池…');
  try {
  const r = await fetch(`/missed-scan?top_n=${top}&pool=${pool}`); const j = await r.json();
  const el = $('missed_result');
  if (!j.ok) { el.innerHTML = '<div class="err">'+j.error+'</div>'; return; }
  const rows = j.data || [];
  if (!rows.length) { el.innerHTML = '<div class="muted">当前观察池内无符合「盈利+被错杀」的标的</div>'; return; }
  let html = `<div class="sub">Contrarian 错杀观察（确信度 = 评分 + 深度超跌加成）</div><table><thead><tr>
    <th>代码</th><th>名称</th><th>现价</th><th>涨跌%</th><th>PE</th><th>52周位%</th><th>评分</th><th>确信度</th><th>信号</th></tr></thead><tbody>`;
  rows.forEach(x => {
    html += `<tr class="has-link"><td><span class="stock-link" onclick="openAnalyze('${x.code}')">${x.code}</span></td>
      <td><span class="stock-link" onclick="openAnalyze('${x.code}')">${x.name}</span></td><td class="mono">${fmt(x.price, 3)}</td>
      <td class="${cls(x.change_rate)} mono">${fmt(x.change_rate, 2)}</td><td class="mono">${fmt(x.pe, 2)}</td>
      <td class="mono">${fmt(x.week52_position_pct, 1)}</td><td class="mono">${fmt(x.score, 1)}</td><td class="mono"><b>${fmt(x.conviction, 1)}</b></td>
      <td>${x.signals.map(s=>pill(s,'good')).join(' ')}</td></tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
  } finally { hideLoading(); }
}
</script>
</body>
</html>
