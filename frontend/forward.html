<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>前向验证 · Contrarian</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" href="favicon.ico" />
</head>
<body data-page="forward">
  <nav class="topnav"><div class="brand"><img src="logo.png" alt="Contrarian" class="logo-img"></div><div class="links"></div><div id="conn" class="status bad">检测中…</div></nav>
  <main class="page">
    <div class="page-head"><h1>前向验证</h1><p>只记录信号产生后真实发生的数据，不用未来信息，不事后改写。</p></div>
    <section class="forward-summary" aria-label="前向验证摘要">
      <div><span>记录</span><strong id="f_total">—</strong></div>
      <div><span>历史动作记录</span><strong id="f_actionable">—</strong></div>
      <div><span>模拟交易</span><strong id="f_trades">—</strong></div>
      <div><span>累计收益</span><strong id="f_return">—</strong></div>
      <div><span>最大回撤</span><strong id="f_dd">—</strong></div>
    </section>
    <div id="f_note" class="hint-bar" style="margin:18px 0"></div>
    <section class="card">
      <div class="card-head"><div class="card-title">固定研究基准影子成交<span class="sub">只用于策略比较，不用于真实建议股数；成交只写一次</span></div></div>
      <div id="f_paper" class="muted">正在读取…</div>
    </section>
    <section class="card">
      <div class="card-head"><div class="card-title">SuperTrend 退出影子记录<span class="sub">只观察，不参与策略决策</span></div></div>
      <div id="f_shadow" class="muted">正在统计…</div>
    </section>
    <section class="card">
      <div class="card-head"><div class="card-title">策略有效性<span class="sub">至少5个到期样本后才允许判定</span></div></div>
      <div id="f_strategies" class="muted">正在统计…</div>
    </section>
    <section class="card">
      <div class="card-head"><div class="card-title">建议流水<span class="sub">相同日期、策略和动作只记录一次</span></div><button class="act" onclick="loadLedger()">刷新</button></div>
      <div id="f_records" class="muted">正在读取账本…</div>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
  async function loadLedger(){
    const j=await (await fetch('/forward-ledger')).json();
    if(!j.ok){$('f_records').innerHTML='<div class="err">'+j.error+'</div>';return;}
    const d=j.data,s=d.summary||{},rows=d.records||[],shadow=d.shadow||{},paper=d.paper_execution||{};
    $('f_total').textContent=s.total||0;$('f_actionable').textContent=s.actionable||0;$('f_trades').textContent=s.trades||0;
    $('f_return').textContent=s.return_pct==null?'等待成交':fmt(s.return_pct,2)+'%';$('f_dd').textContent=s.max_drawdown_pct==null?'等待成交':fmt(s.max_drawdown_pct,2)+'%';$('f_note').textContent=d.note||'';
    const orders=paper.orders||[],metrics=paper.strategy_metrics||[],coverage=paper.point_in_time_coverage||{};
    $('f_paper').innerHTML=`<div class="hint-bar">研究基准 HK$${Number(paper.shadow_capital_hkd||20000).toLocaleString()}（不用于建议股数） · 点时股票池 ${coverage.first_date||'尚未开始'} 至 ${coverage.last_date||'—'} · ${paper.snapshot_days||0}日</div>${metrics.length?`<table><thead><tr><th>策略</th><th>完整往返</th><th>已实现盈亏</th><th>净收益</th><th>PF</th><th>最大回撤</th></tr></thead><tbody>${metrics.map(x=>`<tr><td>${esc(x.strategy_id)}</td><td>${x.complete_round_trips||0}</td><td>HK$${fmt(x.realized_pnl_hkd,2)}</td><td>${fmt(x.net_return_pct,2)}%</td><td>${x.profit_factor==null?'—':fmt(x.profit_factor,2)}</td><td>${fmt(x.max_drawdown_pct,2)}%</td></tr>`).join('')}</tbody></table>`:'尚无已成交影子订单。'}${orders.length?`<table><thead><tr><th>信号日</th><th>代码</th><th>动作</th><th>股数</th><th>信号价</th><th>锁定成交价</th><th>状态</th></tr></thead><tbody>${orders.map(x=>`<tr><td>${x.signal_date}</td><td>${esc(x.code)}</td><td>${esc(x.action)}</td><td>${Math.abs(x.difference_qty)}</td><td>${x.signal_price==null?'—':fmt(x.signal_price,3)}</td><td>${x.fill_price==null?'—':fmt(x.fill_price,3)}</td><td>${x.status==='WAITING_FILL'?'待下一开盘':x.status==='MATURE'?'20日到期':'已锁定成交'}</td></tr>`).join('')}</tbody></table>`:''}<div class="observation-rule">${esc(paper.note||'')}</div>`;
    const shadowRows=shadow.events||[];
    $('f_shadow').innerHTML=`<div class="hint-bar">状态：${esc(shadow.status==='READY_FOR_REVIEW'?'达到复核门槛':'收集中')} · 事件 ${shadow.event_count||0}/${shadow.target_events||30} · 已运行 ${shadow.elapsed_days||0}/${shadow.target_days||183} 天 · 20日成熟样本 ${shadow.mature_20d_count||0}</div>${!shadowRows.length?'尚无 SuperTrend 首次反向事件。':`<table><thead><tr><th>信号日</th><th>方向</th><th>信号收盘</th><th>下一开盘</th><th>退出改善 5/10/20日</th></tr></thead><tbody>${shadowRows.map(x=>`<tr><td>${x.signal_date}</td><td>${x.direction==='EXIT_LONG'?'退出多头':'退出空头'}</td><td>${fmt(x.signal_close,2)}</td><td>${x.next_open==null?'等待':fmt(x.next_open,2)}</td><td>${['5','10','20'].map(h=>x.returns?.[h]==null?'—':fmt(x.returns[h],2)+'%').join(' / ')}</td></tr>`).join('')}</tbody></table>`}<div class="observation-rule">${esc(shadow.note||'仅研究记录，不产生通知或订单。')}</div>`;
    const stats=d.strategy_stats||[];
    $('f_strategies').innerHTML=!stats.length?'尚无到期样本':`<table><thead><tr><th>策略</th><th>到期样本</th><th>胜率</th><th>平均收益</th><th>状态</th></tr></thead><tbody>${stats.map(x=>`<tr><td>${esc(x.strategy_name)}</td><td>${x.mature_samples}</td><td>${x.win_rate_pct==null?'—':fmt(x.win_rate_pct,1)+'%'}</td><td class="${cls(x.average_return_pct||0)}">${x.average_return_pct==null?'—':fmt(x.average_return_pct,2)+'%'}</td><td>${pill(x.status==='ACTIVE'?'有效':x.status==='REVIEW_REQUIRED'?'暂停复核':'收集中',x.status==='ACTIVE'?'good':x.status==='REVIEW_REQUIRED'?'risk':'warn')}</td></tr>`).join('')}</tbody></table>`;
    $('f_records').innerHTML=!rows.length?'尚无记录。打开“今日决策”或等待每日自动任务后开始积累。':`<table><thead><tr><th>信号日</th><th>策略</th><th>动作</th><th>记录时间</th><th>原因</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.signal_date}</td><td>${x.strategy_name}</td><td>${pill(({BUY:'建立多仓',SELL:'退出多仓',HOLD:'持有多仓',WAIT:'等待',REVIEW:'复核',UNAVAILABLE:'数据不可用'})[x.action]||x.action,x.action==='BUY'||x.action==='REVIEW'?'push':x.action==='SELL'||x.action==='UNAVAILABLE'?'risk':'warn')}</td><td>${x.recorded_at.replace('T',' ')}</td><td>${x.reason||'—'}</td></tr>`).join('')}</tbody></table>`;
  }
  loadLedger();
  </script>
</body>
</html>
